name: Build Android APK with Buildozer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          libgmp3-dev \
          zlib1g-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          tar \
          autoconf \
          automake \
          libtool \
          pkg-config
        python -m pip install --upgrade pip
        pip install "pip<24.1"
        pip install cython==0.29.33 buildozer

    - name: Build APK with Buildozer
      run: |
        # Исправление возможных проблем с правами кэша
        mkdir -p .buildozer
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Easter-Calendar-APK
        path: bin/*.apk
        retention-days: 7
