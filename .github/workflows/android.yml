# 1. Восстанавливаем оригинальный постоянный ключ из секретов
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

    # 2. Запускаем шифрование ключа (используя локальный pepk.jar и секреты для паролей)
    - name: Run PEPK Encryption
      run: |
        java -jar pepk.jar \
          --keystore=release.keystore \
          --alias=orthodox_alias \
          --storepass="${{ secrets.KEYSTORE_PASSWORD }}" \
          --keypass="${{ secrets.KEYALIAS_PASSWORD }}" \
          --output=pepk_out.zip \
          --encryptionkey=eb10fe8f7c7c9df715022017b00c6471f8ba8170b13049a11e6c09ffe3056a104a3bbe4ac5a955f4ba4fe93fc8cef27558a3eb9d2a529a2092761fb833b656cd48b9de6a \
          --rsa-aes-encryption \
          --include-cert
      # ВНИМАНИЕ: Если длинный код после --encryptionkey в консоли RuStore изменился, замените строку выше на актуальную!

    # 3. Выгружаем готовый zip-архив в Артефакты
    - name: Upload PEPK Secret Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RuStore-PEPK-Key
        path: pepk_out.zip
        retention-days: 5
