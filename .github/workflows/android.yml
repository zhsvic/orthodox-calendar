name: Build Android APK with Buildozer
on:
  push:
branches: [ main ]
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-22.04
steps:
- name: Checkout code
uses: actions/checkout@v4
- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.10'
# ДОБАВЛЕНО: Установка правильной версии Java 17 для Android SDK
- name: Set up JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
- name: Cache Buildozer global directory
uses: actions/cache@v4
with:
path: ~/.buildozer
key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
restore-keys: |
${{ runner.os }}-buildozer-
- name: Install system dependencies
run: |
sudo apt-get update
sudo apt-get install -y scons build-essential libffi-dev ccache autoconf automake libtool
pip install --upgrade pip
pip install "pip<24.1"
pip install buildozer cython==0.29.33
- name: Build APK with Buildozer
run: |
buildozer android debug
- name: Upload APK Artifact
uses: actions/upload-artifact@v4
with:
name: Easter-Calendar-APK
path: bin/*.apk retention-days: 7
