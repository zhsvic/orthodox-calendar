name: Build Android APK with Buildozer

# Скрипт запускается при каждом пуше в ветку main или вручную через вкладку Actions
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Кэширование Buildozer и Android SDK/NDK для ускорения повторных сборок
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    # Установка всех необходимых системных зависимостей Linux (включая libtool и старый pip)
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y scons build-essential libffi-dev ccache autoconf automake libtool
        pip install --upgrade pip
        pip install "pip<24.1"
        pip install buildozer cython==0.29.33

    # Прямая сборка APK-файла в тихом режиме (без перегрузки логов браузера)
    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    # Автоматическая загрузка готового APK в артефакты GitHub (результаты сборки)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Easter-Calendar-APK
        path: bin/*.apk
        retention-days: 7
