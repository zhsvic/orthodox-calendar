# Шаг 1: Создаем чистый release.keystore прямо в корне проекта
    - name: Generate Production Keystore
      run: |
        keytool -genkey -v \
          -keystore release.keystore \
          -alias orthodox_alias \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass "OrthodoxPass123" \
          -keypass "OrthodoxPass123" \
          -dname "CN=OrthodoxCalendar, OU=App, O=Orthodox, L=Moscow, S=Moscow, C=RU"

    # Шаг 2: Запускаем финальную сборку релиза AAB и APK с правильными переменными
    - name: Build Release with Buildozer
      env:
        APP_ANDROID_KEYSTORE: release.keystore
        APP_ANDROID_KEYSTORE_PASSWORD: OrthodoxPass123
        APP_ANDROID_KEYALIAS: orthodox_alias
        APP_ANDROID_KEYALIAS_PASSWORD: OrthodoxPass123
      run: |
        mkdir -p ~/.buildozer
        buildozer android release
